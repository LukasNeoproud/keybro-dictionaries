name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; must equal "release" in release/catalog.json
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the files against the catalog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/check_release.py "$TAG"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Fails when the release already exists: a published release is never changed.
        run: gh release create "$TAG" release/*.dict release/catalog.json --title "Dictionaries $TAG" --notes "Files listed in catalog.json; see README.md for sources and licence." --target "$GITHUB_SHA"
